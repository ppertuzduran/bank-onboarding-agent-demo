name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Type check (mypy)
        run: mypy app
        continue-on-error: true   # el modelo de embeddings no se tipa; relajamos aquí

      - name: Run tests (sin RAG real)
        env:
          ENVIRONMENT: local
        run: |
          FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          export FERNET_KEY
          pytest -q --ignore=tests/test_rag_integration.py

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks necesita historia completa

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit (vulnerabilidades de dependencias)
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true

      - name: bandit (análisis estático de seguridad)
        run: bandit -r app -q -lll

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.1"
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --redact --exit-code 1 --verbose
