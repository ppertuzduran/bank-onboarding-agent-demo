name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Type check (mypy)
        run: mypy app
        continue-on-error: true   # el modelo de embeddings no se tipa; relajamos aquí

      - name: Run tests (sin RAG real)
        env:
          FERNET_KEY: zmWkqD9U87KZc0Hw4JkA8xq2VvY9HdLWBwQ6uI8rN1A=
          ENVIRONMENT: local
        run: pytest -q --ignore=tests/test_rag_integration.py

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit (vulnerabilidades de dependencias)
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true

      - name: bandit (análisis estático de seguridad)
        run: bandit -r app -q -lll

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
